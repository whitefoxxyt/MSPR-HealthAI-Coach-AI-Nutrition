sonar.projectKey=whitefoxxyt_MSPR-HealthAI-Coach-AI-Nutrition
sonar.organization=whitefoxxyt

sonar.sources=app,scripts
sonar.tests=tests
sonar.python.version=3.12

# Snapshot HITL Food-101 -> PNNS : la duplication entre app/data/portion_sizes.py
# et tests/unit/test_portion_sizes.py:EXPECTED_MAPPING est volontaire (garde-fou
# anti-regen automatique).
sonar.cpd.exclusions=app/data/portion_sizes.py,tests/**

# python:S1244 (egalite stricte sur float) : faux positif systematique sur des
# assertions de test qui comparent des constantes ou de l'arithmetique exacte
# (ex: assert config.RNP_FIBER_G_PER_DAY == 30, assert payload["top1_accuracy"] == 0.0).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1244
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**/*
