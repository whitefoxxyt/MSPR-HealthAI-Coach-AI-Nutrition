services:
  ai-nutrition:
    build: .
    container_name: mspr-ai-nutrition
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - AUTH_API_URL=${AUTH_API_URL:-http://mspr-auth-service:3000}
    depends_on:
      - ollama
    networks:
      - mspr_data_network
      - ai_internal

  ollama:
    image: ollama/ollama:latest
    container_name: mspr-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_internal
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull gemma3:4b && wait"]

  # Service de tests (lance pytest dans un container, testcontainers spawne PG via le socket Docker host)
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: mspr-ai-nutrition-tests
    profiles: ["test"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./docs:/app/docs:ro
      - ../MSPR-DB/migrations:/migrations:ro
    environment:
      MIGRATIONS_DIR: /migrations
      # testcontainers monte le socket host : les containers PG spawned sont accessibles
      # via le reseau bridge default du host. ryuk (cleanup) reste actif.
    network_mode: host

networks:
  mspr_data_network:
    external: true  # créé par le docker-compose.yml racine (MSPR/)
  ai_internal:
    driver: bridge

volumes:
  ollama_data:
